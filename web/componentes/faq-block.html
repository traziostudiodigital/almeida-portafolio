<!-- BLOQUE FAQ: PREGUNTAS FRECUENTES (Reveal @@reveal) -->
<section class="faq-block py-12 px-6 md:px-12 max-w-4xl mx-auto opacity-0 transition-all duration-700 ease-out" data-reveal="@@reveal">
  <h2 class="text-xs uppercase tracking-widest text-brand-accent font-light mb-6" data-i18n="@@nicho.faq.title">
    Preguntas Frecuentes
  </h2>
  <div class="faq-block__list">
    <div class="faq-block__item">
      <details>
        <summary data-i18n="@@nicho.faq.q1">Pregunta 1</summary>
        <p class="faq-block__answer" data-i18n="@@nicho.faq.a1">Respuesta 1</p>
      </details>
    </div>
    <div class="faq-block__item">
      <details>
        <summary data-i18n="@@nicho.faq.q2">Pregunta 2</summary>
        <p class="faq-block__answer" data-i18n="@@nicho.faq.a2">Respuesta 2</p>
      </details>
    </div>
    <div class="faq-block__item">
      <details>
        <summary data-i18n="@@nicho.faq.q3">Pregunta 3</summary>
        <p class="faq-block__answer" data-i18n="@@nicho.faq.a3">Respuesta 3</p>
      </details>
    </div>
  </div>
</section>
