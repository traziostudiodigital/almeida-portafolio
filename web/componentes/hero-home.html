<main id="main-content" class="textura-papel relative h-auto lg:h-[calc(100vh-2.5rem)] overflow-visible lg:overflow-hidden flex flex-col pt-20 pb-10 lg:pb-0 bg-brand-light">

  <!-- Dynamic Canvas Background -->
  <!-- @@include(canvas-cursor.html) -->

  <div class="relative z-10 w-full max-w-7xl mx-auto px-6 md:px-12 flex-1 min-h-0 flex flex-col gap-3 lg:gap-4">

    <!-- Banda superior: título editorial -->
    <div class="hero-titulo">
      <h1 class="hero-titulo__eyebrow hero-stagger" data-i18n="home.h1">
        Peritaje y Tasación de Obras de Arte y Patrimonio Cultural
      </h1>
      <p class="hero-titulo__subtitulo" data-i18n="home.subtitle">
        Dictámenes técnicos independientes respaldados por más de 40 años de trayectoria institucional en Cuba e Iberoamérica.
      </p>
    </div>

    <!-- Banda media: Colección Dispersa (cúmulo + cédula) -->
    <!-- @@include(nicho-index.html) -->

    <!-- Banda inferior: cintillo de cita + firma -->
    <div class="cintillo-final">
      <div class="cintillo-final__frase">
        <p class="cintillo-final__texto" id="frase-texto">Cargando…</p>
        <span class="cintillo-final__atribucion" id="frase-atribucion"></span>
      </div>
      <span class="cintillo-final__divisor" aria-hidden="true"></span>
      <div class="cintillo-final__firma">
        <span class="cintillo-final__wordmark">Almeida</span>
        <span class="cintillo-final__subtitulo">Perito Tasador</span>
      </div>
    </div>

  </div>

</main>
