<!-- Sliding Contact Form Overlay (Initially Hidden) -->
<div id="contact-form-overlay" class="fixed inset-y-0 right-0 z-50 w-full max-w-xl bg-brand-light border-l border-brand-dark/15 shadow-2xl transform translate-x-full transition-transform duration-500 ease-in-out flex flex-col justify-between" role="dialog" aria-labelledby="form-title">
  
  <!-- Header of Slide-over -->
  <div class="p-6 md:p-8 border-b border-brand-dark/10 flex items-center justify-between">
    <div class="flex flex-col">
      <h2 id="form-title" class="font-heading text-3xl text-brand-dark" data-i18n="form.title">Hoja de Encargo Confidencial</h2>
      <span class="text-[9px] uppercase tracking-widest text-[#B08D57] font-semibold" data-i18n="form.subtitle">Secreto Profesional Certificado</span>
    </div>
    <button class="text-brand-dark hover:text-[#B08D57] transition-colors p-2 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#B08D57]" id="contact-form-close" aria-label="Cerrar formulario" data-i18n="nav.close">
      Cerrar (✕)
    </button>
  </div>

  <!-- Scrollable Form Area -->
  <form id="encargo-pericial-form" action="https://formspree.io/f/placeholder" method="POST" class="flex-grow overflow-y-auto p-6 md:p-8 space-y-6 text-xs md:text-sm">
    <!-- Honeypot anti-spam field -->
    <input type="text" name="_gotcha" class="hidden" style="display:none">

    <!-- Nombre -->
    <div class="flex flex-col space-y-2">
      <label for="form-nombre" class="uppercase tracking-widest font-semibold text-brand-dark/70 text-[10px]" data-i18n="form.label.name">Nombre Completo *</label>
      <input type="text" id="form-nombre" name="nombre" required 
             class="bg-transparent border border-brand-dark/20 px-4 py-3 text-brand-dark focus:border-brand-accent focus:outline-none transition-colors duration-200 rounded-none w-full">
    </div>

    <!-- Correo Electrónico -->
    <div class="flex flex-col space-y-2">
      <label for="form-email" class="uppercase tracking-widest font-semibold text-brand-dark/70 text-[10px]" data-i18n="form.label.email">Correo Electrónico *</label>
      <input type="email" id="form-email" name="email" required 
             class="bg-transparent border border-brand-dark/20 px-4 py-3 text-brand-dark focus:border-brand-accent focus:outline-none transition-colors duration-200 rounded-none w-full">
    </div>

    <!-- Teléfono -->
    <div class="flex flex-col space-y-2">
      <label for="form-tel" class="uppercase tracking-widest font-semibold text-brand-dark/70 text-[10px]" data-i18n="form.label.phone">Teléfono de Contacto</label>
      <input type="tel" id="form-tel" name="telefono" 
             class="bg-transparent border border-brand-dark/20 px-4 py-3 text-brand-dark focus:border-brand-accent focus:outline-none transition-colors duration-200 rounded-none w-full">
    </div>

    <!-- Nicho de Interés (Order strictly matching B2B taxonomy) -->
    <div class="flex flex-col space-y-2">
      <label for="form-nicho" class="uppercase tracking-widest font-semibold text-brand-dark/70 text-[10px]" data-i18n="form.label.nicho">Área de Especialidad *</label>
      <select id="form-nicho" name="nicho_interes" required 
              class="bg-brand-light border border-brand-dark/20 px-4 py-3 text-brand-dark focus:border-brand-accent focus:outline-none transition-colors duration-200 rounded-none w-full uppercase tracking-wider text-[11px] font-light">
        <option value="coleccionistas" data-i18n="home.panel2.title">Coleccionistas y Particulares</option>
        <option value="docencia" data-i18n="home.panel3.title">Docencia y Conferencias</option>
        <option value="herencias" data-i18n="home.panel4.title">Herencias y Sucesiones</option>
        <option value="abogados" data-i18n="home.panel5.title">Abogados y Notarios</option>
        <option value="aseguradoras" data-i18n="home.panel6.title">Aseguradoras y Family Offices</option>
        <option value="subacuatico" data-i18n="home.panel7.title">Patrimonio Subacuático</option>
      </select>
    </div>

    <!-- Descripción del Encargo -->
    <div class="flex flex-col space-y-2">
      <label for="form-mensaje" class="uppercase tracking-widest font-semibold text-brand-dark/70 text-[10px]" data-i18n="form.label.message">Descripción del Caso y Piezas *</label>
      <textarea id="form-mensaje" name="mensaje" required rows="5" 
                class="bg-transparent border border-brand-dark/20 px-4 py-3 text-brand-dark focus:border-brand-accent focus:outline-none transition-colors duration-200 rounded-none w-full resize-none leading-relaxed"></textarea>
    </div>

    <!-- GDPR Checkbox -->
    <div class="flex items-start gap-3 pt-2">
      <input type="checkbox" id="form-gdpr" required 
             class="mt-1 h-4 w-4 border-brand-dark/20 text-brand-accent focus:ring-brand-accent rounded-none bg-transparent">
      <label for="form-gdpr" class="text-[11px] text-brand-dark/70 leading-relaxed font-light">
        <span data-i18n="form.gdpr.text">Acepto el tratamiento confidencial de mis datos según la</span> 
        <a href="privacidad.html" class="text-[#B08D57] hover:underline" data-i18n="legal.privacy">Política de Privacidad</a>.
      </label>
    </div>

    <!-- Submit Button -->
    <button type="submit" 
            class="w-full text-center border border-brand-dark bg-brand-dark text-brand-light py-4 text-xs uppercase tracking-widest font-semibold hover:bg-[#B08D57] hover:border-[#B08D57] transition-all duration-300 rounded-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#B08D57]" 
            data-i18n="form.submit">
      Enviar Hoja de Encargo
    </button>
  </form>

  <!-- Legal Footer of Slide-over -->
  <div class="p-6 border-t border-brand-dark/10 text-center bg-[#2E3238]/5">
    <p class="text-[10px] uppercase tracking-widest text-brand-dark/50" data-i18n="form.legal.disclaimer">
      Su consulta se procesa bajo secreto profesional pericial.
    </p>
  </div>
</div>
