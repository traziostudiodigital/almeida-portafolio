<!-- web/componentes/chat-ia.html -->
<div id="chat-ia-widget" class="fixed bottom-6 right-6 z-50">

  <!-- TRIGGER: nodo/constelación animado -->
  <button
    id="chat-ia-trigger"
    type="button"
    aria-expanded="false"
    aria-label="Abrir consulta pericial IA"
    class="group relative w-12 h-12 rounded-full bg-[#2E3238] border border-[#B08D57]/40
           flex items-center justify-center transition-all duration-300
           hover:border-[#B08D57] hover:shadow-[0_0_20px_-2px_rgba(176,141,87,0.35)]"
  >
    <svg viewBox="0 0 48 48" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Nodo central -->
      <circle cx="24" cy="24" r="2.5" fill="#B08D57" class="chat-node-core" />

      <!-- Nodos satélite -->
      <circle cx="14" cy="16" r="1.4" fill="#B08D57" opacity="0.7" />
      <circle cx="34" cy="15" r="1.2" fill="#B08D57" opacity="0.55" />
      <circle cx="33" cy="33" r="1.4" fill="#B08D57" opacity="0.7" />
      <circle cx="13" cy="32" r="1.1" fill="#B08D57" opacity="0.5" />

      <!-- Líneas de constelación (trazado animado) -->
      <g stroke="#B08D57" stroke-width="0.75" fill="none">
        <path class="chat-line chat-line-1" d="M24 24 L14 16" />
        <path class="chat-line chat-line-2" d="M24 24 L34 15" />
        <path class="chat-line chat-line-3" d="M24 24 L33 33" />
        <path class="chat-line chat-line-4" d="M24 24 L13 32" />
      </g>
    </svg>
  </button>

  <!-- VENTANA DEL CHAT -->
  <div
    id="chat-ia-window"
    class="hidden absolute bottom-16 right-0 w-[340px] max-w-[calc(100vw-2rem)]
           bg-[#EAE7E2] border border-[#B08D57]/30 shadow-2xl
           flex flex-col overflow-hidden"
    style="font-family: 'Source Serif 4', serif;"
  >
    <!-- Header -->
    <div class="border-b border-[#B08D57]/25 px-5 py-4 flex items-start justify-between">
      <div>
        <h3 class="text-sm font-semibold text-[#2E3238] tracking-wide" data-i18n="chat.header_title">
          Consulta Pericial IA
        </h3>
        <p class="text-[11px] text-[#2E3238]/60 mt-0.5 leading-snug" data-i18n="chat.header_subtitle">
          Asistencia técnica basada en el archivo pericial de Almeida
        </p>
      </div>
      <button id="chat-ia-close" type="button" aria-label="Cerrar" class="text-[#2E3238]/50 hover:text-[#2E3238] text-lg leading-none mt-0.5">
        ✕
      </button>
    </div>

    <!-- Mensajes -->
    <div id="chat-ia-messages" class="flex-1 max-h-[360px] overflow-y-auto px-5 py-4 space-y-3">
      <!-- renderMessage() inyecta aquí -->
    </div>

    <!-- Loading -->
    <div id="chat-ia-loading" class="hidden px-5 pb-2">
      <p class="text-[11px] text-[#B08D57] italic" data-i18n="chat.analyzing">Consultando dictámenes y archivo pericial...</p>
    </div>

    <!-- Input -->
    <form id="chat-ia-form" class="border-t border-[#B08D57]/25 px-4 py-3 flex items-center gap-2">
      <input
        id="chat-ia-input"
        type="text"
        autocomplete="off"
        data-i18n-placeholder="chat.input_placeholder"
        placeholder="Escriba su consulta pericial..."
        class="flex-1 bg-transparent text-xs text-[#2E3238] placeholder-[#2E3238]/40
               border-b border-[#B08D57]/30 focus:border-[#B08D57] outline-none py-1.5
               transition-colors"
      />
      <button type="submit" aria-label="Enviar" class="text-[#B08D57] hover:text-[#2E3238] transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M4 12h16M14 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

    <!-- Footer notice -->
    <p class="text-center text-[9px] tracking-wide uppercase text-[#2E3238]/40 py-2 border-t border-[#B08D57]/15" data-i18n="chat.footer_notice">
      Atención confidencial · Dictámenes bajo estricto secreto profesional
    </p>
  </div>
</div>
